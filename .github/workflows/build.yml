name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: bump
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - run: |
          sed -i -E "s/CV v[0-9]+\.[0-9]+\.[0-9]+/CV v${{ steps.bump.outputs.version }}/" docs/index.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json docs/index.md
          git commit -m "${{ steps.bump.outputs.version }}"
          git push

  build-pdf:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex fonts-liberation
      - name: Build PDF
        run: |
          pandoc docs/index.md -o david-tsofin-cv.pdf \
            --pdf-engine=xelatex \
            -V mainfont="Liberation Sans" \
            -V geometry:margin=0.8in \
            -V fontsize=11pt \
            -V colorlinks=true
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add david-tsofin-cv.pdf
          git commit -m "Update CV PDF" || echo "No changes"
          git push

  deploy:
    needs: version
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      SVC_ID: ${{ vars.SVC_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
      - run: railway up --service=${{ env.SVC_ID }}